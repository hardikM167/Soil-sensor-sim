<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced Soil DAQ Interface</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #0b1120;
      --panel: #1e293b;
      --accent: #10b981;
      --text: #f8fafc;
      --grid: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 15px; display: flex; flex-direction: column; align-items: center; }
    
    .header { width: 100%; max-width: 1000px; padding: 15px 20px; background: var(--panel); border-radius: 8px; border-left: 4px solid var(--accent); margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
    .header h1 { font-size: 1.2rem; text-transform: uppercase; letter-spacing: 1px; color: var(--accent); }
    .header p { font-size: 0.8rem; color: #94a3b8; }
    
    .grid-container { display: grid; grid-template-columns: 1fr 300px; gap: 15px; width: 100%; max-width: 1000px; }
    @media(max-width: 768px) { .grid-container { grid-template-columns: 1fr; } }
    
    .card { background: var(--panel); border-radius: 8px; padding: 15px; border: 1px solid var(--grid); }
    .card-title { font-size: 0.85rem; text-transform: uppercase; color: #94a3b8; margin-bottom: 10px; border-bottom: 1px solid var(--grid); padding-bottom: 5px; }
    
    /* Multimeter Display */
    .meter-display { background: #000; padding: 15px; border-radius: 6px; text-align: center; border: 1px solid #475569; margin-bottom: 15px; }
    .meter-val { font-family: 'Courier New', monospace; font-size: 2.5rem; font-weight: bold; color: var(--accent); text-shadow: 0 0 10px rgba(16,185,129,0.5); }
    
    /* Controls */
    .control-row { margin-bottom: 15px; }
    label { display: flex; justify-content: space-between; font-size: 0.8rem; margin-bottom: 5px; color: #cbd5e1; }
    input[type=range] { width: 100%; accent-color: var(--accent); cursor: pointer; }
    
    /* Live Terminal Log */
    .terminal { background: #020617; border-radius: 6px; padding: 10px; font-family: 'Courier New', monospace; font-size: 0.75rem; color: #38bdf8; height: 150px; overflow-y: auto; border: 1px solid #1e293b; }
    .terminal p { margin-bottom: 4px; }
    
    /* Chart Container */
    .chart-container { width: 100%; height: 250px; background: #0f172a; border-radius: 6px; padding: 10px; }
    
    /* QR Code */
    #qrcode { background: white; padding: 10px; border-radius: 6px; display: inline-block; }
    .qr-box { text-align: center; margin-top: 10px; }
  </style>
</head>
<body>

  <div class="header">
    <div>
      <h1>GNDEC Applied Sensor Lab</h1>
      <p>Soil Conductivity DAQ Simulation • v2.0</p>
    </div>
    <div id="statusDot" style="color: var(--accent); font-size: 0.8rem;">● SYSTEM ONLINE</div>
  </div>

  <div class="grid-container">
    
    <!-- Left Column: Graph & Terminal -->
    <div style="display: flex; flex-direction: column; gap: 15px;">
      <div class="card">
        <div class="card-title">Live Telemetry (Current Flow)</div>
        <div class="chart-container">
          <canvas id="liveChart"></canvas>
        </div>
      </div>
      
      <div class="card">
        <div class="card-title">DAQ Event Log</div>
        <div class="terminal" id="terminalLog">
          <p>> Initialize boot sequence...</p>
          <p>> Probes connected. Awaiting data loop.</p>
        </div>
      </div>
    </div>

    <!-- Right Column: Controls & Meter -->
    <div style="display: flex; flex-direction: column; gap: 15px;">
      
      <div class="card">
        <div class="card-title">Digital Ammeter</div>
        <div class="meter-display">
          <div class="meter-val" id="mAValue">0.00 mA</div>
          <div style="color: #64748b; font-size: 0.8rem; margin-top: 5px;" id="rValue">Resistance: -- Ω</div>
        </div>
        
        <div class="control-row">
          <label><span>Ion Concentration (Salts/Fertilizer)</span> <span id="ionLbl">45%</span></label>
          <input type="range" id="ionSlider" min="1" max="100" value="45">
        </div>
        <div class="control-row">
          <label><span>Soil Temperature</span> <span id="tempLbl">22°C</span></label>
          <input type="range" id="tempSlider" min="5" max="45" value="22">
        </div>
        <div class="control-row">
          <label><span>Probe Spacing</span> <span id="spaceLbl">2.0 cm</span></label>
          <input type="range" id="spaceSlider" min="10" max="50" value="20"> <!-- 1.0 to 5.0 -->
        </div>
      </div>

      <div class="card qr-box">
        <div class="card-title" style="border: none; margin-bottom: 5px;">Scan for Mobile Demo</div>
        <div id="qrcode"></div>
      </div>

    </div>
  </div>

  <script>
    // Elements
    const ionSlider = document.getElementById("ionSlider");
    const tempSlider = document.getElementById("tempSlider");
    const spaceSlider = document.getElementById("spaceSlider");
    const mAValue = document.getElementById("mAValue");
    const rValue = document.getElementById("rValue");
    const terminalLog = document.getElementById("terminalLog");
    
    // Physics Engine Variables
    let current_mA = 0;
    let rSoil = 0;

    // Chart.js Setup
    const ctx = document.getElementById('liveChart').getContext('2d');
    const liveChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: Array(20).fill(''), // 20 data points on X axis
        datasets: [{
          label: 'Current (mA)',
          data: Array(20).fill(0),
          borderColor: '#10b981',
          backgroundColor: 'rgba(16, 185, 129, 0.1)',
          borderWidth: 2,
          fill: true,
          tension: 0.4,
          pointRadius: 0
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: { duration: 0 },
        scales: {
          y: { min: 0, max: 10, grid: { color: '#334155' }, ticks: { color: '#94a3b8' } },
          x: { grid: { display: false } }
        },
        plugins: { legend: { display: false } }
      }
    });

    function addLog(msg) {
      const time = new Date().toLocaleTimeString('en-US', { hour12: false, hour: "numeric", minute: "numeric", second: "numeric" });
      const p = document.createElement("p");
      p.innerText = `[${time}] ${msg}`;
      terminalLog.appendChild(p);
      terminalLog.scrollTop = terminalLog.scrollHeight;
    }

    function calculatePhysics() {
      const ions = parseInt(ionSlider.value);
      const tempC = parseInt(tempSlider.value);
      const spaceCm = parseInt(spaceSlider.value) / 10;

      // Update Labels
      document.getElementById("ionLbl").innerText = ions + "%";
      document.getElementById("tempLbl").innerText = tempC + "°C";
      document.getElementById("spaceLbl").innerText = spaceCm.toFixed(1) + " cm";

      // Base Resistance based on ions
      let baseR = 25000 / (1 + (ions / 5));
      
      // Distance modifier (further apart = higher resistance)
      let distanceR = baseR * (spaceCm / 2.0);
      
      // Temperature modifier (higher temp = faster ions = lower resistance)
      // Approx 2% change per degree C from baseline 20C
      let tempFactor = 1 - ((tempC - 20) * 0.02);
      if (tempFactor < 0.2) tempFactor = 0.2; // Floor limits

      rSoil = distanceR * tempFactor;
      
      // Calculate final current via Ohm's Law (I = V/R) assuming 9V boosted loop
      current_mA = (9.0 / rSoil) * 1000;

      // Update UI
      mAValue.innerText = current_mA.toFixed(2) + " mA";
      rValue.innerText = "Resistance: " + Math.round(rSoil) + " Ω";
    }

    // Chart Update Loop (10 FPS)
    setInterval(() => {
      calculatePhysics();
      
      // Add slight analog noise/jitter for realism (+/- 1%)
      let jitter = current_mA * (Math.random() * 0.02 - 0.01);
      let plotted_mA = current_mA + jitter;

      const dataArr = liveChart.data.datasets[0].data;
      dataArr.push(plotted_mA);
      dataArr.shift(); // Remove oldest data point
      liveChart.update();
    }, 100);

    // Terminal Logging Loop (Every 2 seconds)
    setInterval(() => {
      let status = "NORMAL";
      if(current_mA < 0.5) status = "LOW_NUTRIENT";
      if(current_mA > 4.0) status = "HIGH_SALINITY";
      
      addLog(`R_SENSE: ${Math.round(rSoil)}Ω | I_OUT: ${current_mA.toFixed(2)}mA | STAT: ${status}`);
    }, 2000);

    // Generate QR Code on load
    window.addEventListener("DOMContentLoaded", () => {
      const url = window.location.href.startsWith("http") ? window.location.href : "https://github.com";
      new QRCode(document.getElementById("qrcode"), {
        text: url, width: 120, height: 120, colorDark : "#000000", colorLight : "#ffffff"
      });
    });

    // Initial log
    setTimeout(() => { addLog("> Sensor polling started..."); }, 1000);
  </script>
</body>
</html>
